services:
  smartfood-backend:
    build: ./SmartFoodBackend
    ports:
      - "5000:5000"
    command: ["flask", "--app", "app:app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]
    environment:
      SQLALCHEMY_DATABASE_URI: "mssql+pyodbc://smartfood_user:SmartFood123!@host.docker.internal:1433/SmartFood?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes"
      JWT_SECRET_KEY: "dev-secret"
